<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>toget300 的 App</title>
<style>
:root{--bg:#F6F4EF;--card:#fff;--ink:#1C1B22;--muted:#6B6875;--line:#E4E0D8;--link:#3A62C9}
@media (prefers-color-scheme:dark){:root{--bg:#16151A;--card:#211F27;--ink:#EEEBF3;--muted:#9C98A6;--line:#34313C;--link:#8FA8F0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,"PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:760px;margin:0 auto;padding:40px 16px 60px}
h1{margin:0 0 6px;font-size:28px}
p.lead{margin:0 0 28px;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
li b{display:block;font-size:18px}
li span{color:var(--muted);font-size:14px}
li a{color:var(--link);font-size:14px;margin-right:14px}
footer{margin-top:36px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
<h1>toget300 的 App</h1>
<p class="lead">個人開發的 iPhone App：背單字小遊戲、好習慣養成和實用工具。</p>
<ul>
  <li><b>重啟66：打倒壞習慣怪獸</b><span>把壞習慣變成怪獸，每天打卡打倒它。</span><br><a href="https://toget300.github.io/reset66-docs/">支援</a><a href="https://toget300.github.io/reset66-docs/privacy.html">隱私權政策</a></li>

  <li><b>單字冰箱：英文拼字合成遊戲</b><span>拼對單字，水果合成變大。</span><br><a href="https://toget300.github.io/wordfridge-docs/">支援</a><a href="https://toget300.github.io/wordfridge-docs/privacy.html">隱私權政策</a></li>
  <li><b>單字紅綠燈：英文單字路口指揮</b><span>答對換燈，答錯就撞車。</span><br><a href="https://toget300.github.io/wordtraffic-docs/">支援</a><a href="https://toget300.github.io/wordtraffic-docs/privacy.html">隱私權政策</a></li>
  <li><b>多重匯率換算機</b><span>即時匯率・多幣同時換算。</span><br><a href="https://toget300.github.io/multifx-docs/">支援</a><a href="https://toget300.github.io/multifx-docs/privacy.html">隱私權政策</a></li>
</ul>
<footer>聯絡：toget300@gmail.com</footer>

</html>
